location = /paipai/api/imports/excel { return 404; }
location = /paipai/api/imports/excel/sample { return 404; }

location ^~ /paipai/v1/ {
    return 404;
}

location ^~ /paipai/assets/ {
    root /var/www;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /paipai/ {
    root /var/www;
    try_files $uri $uri/ /paipai/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
